name: Build and publish v2.4.0

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'build.ps1'
      - 'RELEASE_NOTES.md'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-v2.4.0
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'VincentZ-gd/codex-quota-rings'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build and test
        shell: pwsh
        run: ./build.ps1
      - name: Publish release if absent
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release view v2.4.0 --json url 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'v2.4.0 already exists; leaving its assets unchanged.'
            exit 0
          }
          gh release create v2.4.0 dist/CodexQuotaRings-v2.4.0-windows.zip dist/SHA256SUMS.txt --target $env:RELEASE_COMMIT --title 'Codex Quota Rings v2.4.0' --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed.' }
